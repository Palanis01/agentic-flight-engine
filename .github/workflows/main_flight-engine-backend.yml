name: Deploy Flight Engine Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package (ZIP)
        run: |
          cd backend
          zip -r ../backend.zip .

      - name: Deploy to Azure WebApp (FastAPI)
        uses: azure/webapps-deploy@v2
        with:
          app-name: flight-engine-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend.zip
